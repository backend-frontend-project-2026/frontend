name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Test and build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1